name: Verify RTX Spark release

# Build and smoke-test the Windows Arm64 sm_121 package on an RTX Spark N1X.
# After publication, independently check the downloadable archive on a hosted runner.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing RTX Spark release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the Windows Arm64 archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="basalt-${TAG}-windows-arm64.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern "$archive.sha256"

      - name: Verify checksum, package contents and Arm64 executables
        shell: python
        run: |
          import hashlib
          import os
          import struct
          import zipfile
          from pathlib import Path

          top = f"basalt-{os.environ['TAG']}-windows-arm64"
          archive = Path(f"{top}.zip")
          digest, name = Path(f"{archive}.sha256").read_text().split()
          assert name == archive.name
          with archive.open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == digest
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              for name in ("setup.cmd", "start.cmd", "basalt_config.json", "serve/server.py",
                           "requirements.txt", "LICENSE", "THIRD_PARTY_LICENSES", "licenses/NVIDIA-CUDA-EULA.txt"):
                  package.getinfo(f"{top}/{name}")
              for name in ("basalt.exe", "basalt-bench.exe", "basalt-probe.exe", "basalt-vision.exe",
                           "cublas64_13.dll", "cublasLt64_13.dll"):
                  with package.open(f"{top}/bin/{name}") as binary:
                      assert binary.read(2) == b"MZ", name
                      binary.seek(0x3C)
                      pe_offset, = struct.unpack("<I", binary.read(4))
                      binary.seek(pe_offset)
                      assert binary.read(6) == b"PE\x00\x00\x64\xaa", name
          print(f"Verified {archive.name} ({digest})")
