<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 720" width="1200" height="720" role="img"
     aria-label="The Long Way Up: Hohmann transfer from a 7000 km orbit to a 21000 km orbit">

  <defs>
    <radialGradient id="bgGrad" cx="0.62" cy="0.55" r="0.9">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>

    <radialGradient id="ocean" cx="0.38" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#3f8fd6"/>
      <stop offset="0.55" stop-color="#1c5fae"/>
      <stop offset="1" stop-color="#0c2f63"/>
    </radialGradient>

    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#7cc4ff" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#7cc4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arcGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>

    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd166"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6ea8ff"/>
    </marker>

    <clipPath id="earthClip">
      <circle cx="760" cy="400" r="91"/>
    </clipPath>

    <!-- transfer ellipse: periapsis (860,400) apoapsis (460,400), centre (660,400), rx=200 ry=173.205 -->
    <path id="transferPath" d="M 860 400 A 200 173.205 0 0 0 460 400" fill="none"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- restrained star field -->
  <g fill="#dfe9ff">
    <circle cx="90"  cy="70"  r="1.4" opacity="0.7"/><circle cx="180" cy="140" r="1"   opacity="0.4"/>
    <circle cx="260" cy="60"  r="1.2" opacity="0.55"/><circle cx="330" cy="200" r="0.9" opacity="0.35"/>
    <circle cx="420" cy="90"  r="1.5" opacity="0.75"/><circle cx="500" cy="55"  r="1"   opacity="0.4"/>
    <circle cx="560" cy="150" r="1.2" opacity="0.5"/><circle cx="640" cy="70"  r="0.9" opacity="0.35"/>
    <circle cx="720" cy="120" r="1.3" opacity="0.6"/><circle cx="820" cy="60"  r="1"   opacity="0.4"/>
    <circle cx="900" cy="130" r="1.4" opacity="0.65"/><circle cx="980" cy="80"  r="0.9" opacity="0.35"/>
    <circle cx="1060" cy="150" r="1.2" opacity="0.5"/><circle cx="1130" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="1160" cy="230" r="1"  opacity="0.4"/><circle cx="1090" cy="300" r="0.9" opacity="0.3"/>
    <circle cx="1150" cy="420" r="1.3" opacity="0.55"/><circle cx="1120" cy="560" r="1" opacity="0.4"/>
    <circle cx="1050" cy="660" r="1.2" opacity="0.5"/><circle cx="960" cy="690" r="0.9" opacity="0.3"/>
    <circle cx="700" cy="690" r="1.3" opacity="0.55"/><circle cx="540" cy="670" r="1"  opacity="0.4"/>
    <circle cx="430" cy="700" r="1.2" opacity="0.5"/><circle cx="300" cy="660" r="0.9" opacity="0.35"/>
    <circle cx="140" cy="620" r="1.4" opacity="0.6"/><circle cx="60"  cy="500" r="1"   opacity="0.4"/>
    <circle cx="100" cy="380" r="1.2" opacity="0.5"/><circle cx="50"  cy="260" r="0.9" opacity="0.35"/>
    <circle cx="240" cy="320" r="1"   opacity="0.4"/><circle cx="380" cy="420" r="0.9" opacity="0.3"/>
    <circle cx="300" cy="520" r="1.2" opacity="0.45"/><circle cx="470" cy="240" r="1"  opacity="0.4"/>
    <circle cx="600" cy="260" r="0.9" opacity="0.3"/><circle cx="1010" cy="220" r="1"  opacity="0.4"/>
    <circle cx="1180" cy="120" r="0.9" opacity="0.35"/><circle cx="220" cy="700" r="1.1" opacity="0.45"/>
    <circle cx="860" cy="705" r="0.9" opacity="0.3"/><circle cx="660" cy="60" r="0.8" opacity="0.3"/>
    <circle cx="1140" cy="640" r="1.2" opacity="0.5"/><circle cx="40" cy="680" r="1" opacity="0.4"/>
  </g>

  <!-- title -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="60" y="92" font-size="52" font-weight="bold" fill="#f2f6ff" letter-spacing="2">THE LONG WAY UP</text>
    <text x="62" y="126" font-size="19" fill="#8fa3c8" letter-spacing="1">A Hohmann transfer — the cheapest two-burn route between circular orbits</text>
    <line x1="62" y1="146" x2="430" y2="146" stroke="#6ea8ff" stroke-width="2" opacity="0.6"/>

    <!-- data panel -->
    <g font-size="17" fill="#dbe6ff">
      <text x="62" y="192" font-weight="bold" fill="#ffd166">INNER ORBIT</text>
      <text x="62" y="216">r₁ = 7,000 km &#183; circular speed 7.55 km/s</text>

      <text x="62" y="262" font-weight="bold" fill="#ffd166">BURN 1 &#183; PERIAPSIS (RIGHT)</text>
      <text x="62" y="286">Δv₁ = +1.70 km/s, prograde</text>
      <text x="62" y="308" font-size="14" fill="#8fa3c8">thrust points forward, along the flight path</text>

      <text x="62" y="354" font-weight="bold" fill="#ffd166">COAST</text>
      <text x="62" y="378">half of the transfer ellipse &#8594; 137 minutes</text>
      <text x="62" y="400" font-size="14" fill="#8fa3c8">a = (r₁ + r₂)/2 = 14,000 km &#183; t = π&#8730;(a³/μ)</text>

      <text x="62" y="446" font-weight="bold" fill="#ffd166">BURN 2 &#183; APOAPSIS (LEFT)</text>
      <text x="62" y="470">Δv₂ = +1.28 km/s, prograde</text>
      <text x="62" y="492" font-size="14" fill="#8fa3c8">speeds the probe up to 4.36 km/s to circularise</text>

      <text x="62" y="538" font-size="14" fill="#8fa3c8">μ = 398,600 km³/s² &#183; both burns push with the motion</text>
      <text x="62" y="562" font-size="14" fill="#8fa3c8">r₁ and r₂ are measured from Earth's centre (white dot).</text>
      <text x="62" y="586" font-size="14" fill="#8fa3c8">Both circles are drawn to the same scale.</text>
    </g>
  </g>

  <!-- orbits -->
  <g fill="none">
    <circle cx="760" cy="400" r="300" stroke="#6ea8ff" stroke-width="2" opacity="0.85"/>
    <circle cx="760" cy="400" r="100" stroke="#6ea8ff" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- direction chevrons (motion is counter-clockwise on screen) -->
  <g fill="#6ea8ff" opacity="0.9">
    <path d="M 752 96 L 766 92 L 766 100 z" transform="rotate(180 759 96)"/>
    <path d="M 754 92 L 768 96 L 754 100 z"/>
    <path d="M 754 496 L 768 500 L 754 504 z"/>
  </g>

  <!-- radial measurement from Earth's centre -->
  <g>
    <line x1="760" y1="400" x2="1019.8" y2="550" stroke="#9fb6dd" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="840.4" y1="460.7" x2="852.8" y2="439.3" stroke="#9fb6dd" stroke-width="2"/>
    <line x1="1013.4" y1="560.7" x2="1026.2" y2="539.3" stroke="#9fb6dd" stroke-width="2"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#cfe0ff">
      <text x="862" y="466">r₁ = 7,000 km</text>
      <text x="1008" y="584" text-anchor="middle">r₂ = 21,000 km</text>
    </g>
    <circle cx="760" cy="400" r="4" fill="#ffffff"/>
  </g>

  <!-- transfer arc: glow + main -->
  <use xlink:href="#transferPath" href="#transferPath" stroke="#ff9f43" stroke-width="10" opacity="0.22"/>
  <use xlink:href="#transferPath" href="#transferPath" stroke="url(#arcGrad)" stroke-width="3.5"/>

  <!-- small chevrons along transfer, travelling right to left over the top -->
  <g fill="#ffd166" opacity="0.9">
    <path d="M 826 322 L 836 330 L 822 333 z"/>
    <path d="M 654 222 L 666 226 L 656 235 z"/>
    <path d="M 492 322 L 482 330 L 496 333 z"/>
  </g>

  <!-- burn 1 arrow: prograde (up) at periapsis, offset clear of the arc -->
  <g>
    <line x1="880" y1="394" x2="880" y2="346" stroke="#ffd166" stroke-width="3" marker-end="url(#head)"/>
    <g font-family="Helvetica, Arial, sans-serif">
      <text x="894" y="352" font-size="16" font-weight="bold" fill="#ffd166">BURN 1</text>
      <text x="894" y="372" font-size="15" fill="#f2f6ff">Δv₁ +1.70 km/s</text>
      <text x="894" y="390" font-size="13" fill="#8fa3c8">prograde — with the motion</text>
    </g>
  </g>

  <!-- burn 2 arrow: prograde (down) at apoapsis -->
  <g>
    <line x1="442" y1="408" x2="442" y2="456" stroke="#ffd166" stroke-width="3" marker-end="url(#head)"/>
    <g font-family="Helvetica, Arial, sans-serif" text-anchor="end">
      <text x="432" y="414" font-size="16" font-weight="bold" fill="#ffd166">BURN 2</text>
      <text x="432" y="434" font-size="15" fill="#f2f6ff">Δv₂ +1.28 km/s</text>
      <text x="432" y="452" font-size="13" fill="#8fa3c8">prograde — circularise</text>
    </g>
  </g>

  <!-- Earth: atmosphere, ocean, land, clouds, caps -->
  <circle cx="760" cy="400" r="106" fill="url(#atmo)"/>
  <circle cx="760" cy="400" r="91" fill="url(#ocean)"/>
  <g clip-path="url(#earthClip)">
    <path d="M 692 352 q 22 -22 50 -10 q 20 10 10 28 q -16 20 -42 13 q -28 -8 -18 -31 z" fill="#3f9d5a"/>
    <path d="M 772 428 q 28 -14 50 8 q 12 16 -6 28 q -24 14 -46 -2 q -14 -18 2 -34 z" fill="#47a862"/>
    <path d="M 730 468 q 16 -7 26 4 q 6 11 -6 17 q -15 6 -24 -4 q -5 -11 4 -17 z" fill="#3f9d5a"/>
    <path d="M 700 410 q 12 -6 20 3 q 4 9 -6 13 q -12 4 -18 -4 q -3 -8 4 -12 z" fill="#47a862"/>
    <ellipse cx="760" cy="316" rx="52" ry="12" fill="#eef6ff" opacity="0.65"/>
    <ellipse cx="760" cy="486" rx="50" ry="11" fill="#eef6ff" opacity="0.6"/>
    <path d="M 700 380 q 30 -10 60 -2 q 22 6 40 0 q -14 12 -44 10 q -34 -2 -56 -8 z" fill="#ffffff" opacity="0.22"/>
    <path d="M 720 445 q 26 -8 52 0 q -20 10 -52 0 z" fill="#ffffff" opacity="0.18"/>
  </g>
  <circle cx="760" cy="400" r="91" fill="none" stroke="#9fd0ff" stroke-width="1.2" opacity="0.5"/>

  <!-- probe flying the transfer, 8 s loop -->
  <g>
    <g>
      <!-- exhaust -->
      <path d="M -16 -3 L -30 0 L -16 3 z" fill="#ff9f43" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.35;0.85" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <rect x="-9" y="-5" width="15" height="10" rx="2" fill="#e8eefc" stroke="#8fa3c8" stroke-width="1"/>
      <path d="M 6 -5 L 15 0 L 6 5 z" fill="#ffd166"/>
      <!-- solar panels -->
      <rect x="-6" y="-14" width="9" height="7" fill="#4f7fd0" stroke="#9fb6dd" stroke-width="0.8"/>
      <rect x="-6" y="7" width="9" height="7" fill="#4f7fd0" stroke="#9fb6dd" stroke-width="0.8"/>
      <line x1="-1.5" y1="-7" x2="-1.5" y2="-5" stroke="#9fb6dd" stroke-width="1"/>
      <line x1="-1.5" y1="5" x2="-1.5" y2="7" stroke="#9fb6dd" stroke-width="1"/>
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#transferPath" href="#transferPath"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- burn site rings -->
  <circle cx="860" cy="400" r="9" fill="none" stroke="#ffd166" stroke-width="2">
    <animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="400" r="9" fill="none" stroke="#ffd166" stroke-width="2">
    <animate attributeName="r" values="7;12;7" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- orbit tags -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9fb6dd">
    <text x="760" y="288" text-anchor="middle">inner orbit &#183; 7,000 km</text>
    <text x="760" y="620" text-anchor="middle">outer orbit &#183; 21,000 km</text>
    <text x="660" y="212" text-anchor="middle" fill="#ffd166">coast 137 min</text>
  </g>
</svg>